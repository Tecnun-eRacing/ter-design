[package]
name = "ter-dbc"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = { version = "1.1", default-features = false }
embassy-time = { version = "0.5", optional = true }
embassy-time-git = { package = "embassy-time", git = "https://github.com/embassy-rs/embassy.git", rev = "5e697db336ecdb123ea1dd9d120e40b2b06e2c19", optional = true }
embedded-can = "0.4"

[build-dependencies]
anyhow = "1.0.104"
dbc-codegen2 = "0.1.9"

[dev-dependencies]
arbitrary = "1.4.2"

[features]
default = []
embassy-time = ["dep:embassy-time"]
git = ["dep:embassy-time-git"]
